    <section class="flex justify-center items-center gap-10">
      <!-- Order Summary -->
      <div

          <!-- JS se items yahan append honge -->

        <!-- Fixed Total -->

          class="mt-4 border-t pt-4 flex justify-between items-center sticky bottom-0 bg-white z-10"
        >

          <span class="font-bold text-xl text-[#0090ff]" id="total-price"
            >Rs.0</span
          >
        </div>
      </div>

      <div class="w-1/3 bg-white max-h-[510px] shadow-2xl rounded-xl p-8 mt-28">

          Confirm Your Order
        </h1>

        <!-- User Details -->
        <div class="flex flex-col gap-5 mb-6">
          <input
            type="text"
            id="userName"
            placeholder="Your Name"
            class="border border-gray-300 p-4 text-lg rounded-lg focus:ring-2 focus:ring-[#0090ff] outline-none"
          />
          <input
            type="text"
            id="userContact"
            placeholder="Contact Number"
            class="border border-gray-300 p-4 text-lg rounded-lg focus:ring-2 focus:ring-[#0090ff] outline-none"
          />
          <textarea
            id="userAddress"
            placeholder="Address"
            class="border border-gray-300 p-4 text-lg rounded-lg focus:ring-2 focus:ring-[#0090ff] outline-none"
            rows="4"
          ></textarea>
        </div>

        <button
          id="confirmOrder"
          class="w-full bg-[#0090ff] text-white font-semibold text-xl py-4 rounded-lg hover:bg-blue-600 transition"
        >
          ✅ Confirm Order
        </button>
      </div>
    </section>

    <script>
      const productList = document.getElementById("product-list");
      const totalPriceEl = document.getElementById("total-price");

      let bucket = JSON.parse(localStorage.getItem("bucket")) || [];

      function renderCheckout() {
        productList.innerHTML = "";
        if (bucket.length === 0) {
          productList.innerHTML =
            '<p class="text-red-500 text-center font-semibold">🛒 Your bucket is empty!</p>';
          totalPriceEl.textContent = "Rs.0";
          return;
        }

        let total = 0;

        bucket.forEach((item, index) => {
          total += item.price * item.quantity;

          const card = document.createElement("div");
          card.className =
            "mb-4 bg-gray-50 p-4 rounded-lg shadow-sm border hover:shadow-md transition";

          card.innerHTML = `
        <div class="flex items-center gap-4">
          <img src="${item.img || "images/placeholder.png"}" 
               class="w-16 h-16 object-cover rounded-lg border" 
               alt="${item.name}">
          <div class="flex-1">
            <p class="font-semibold text-gray-800">${item.name}</p>
            <p class="text-gray-600 text-sm">Price: Rs.${item.price}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateQuantity(${index}, 'decrease')" 
              class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">-</button>
            <span class="w-8 text-center font-semibold">${item.quantity}</span>
            <button onclick="updateQuantity(${index}, 'increase')" 
              class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">+</button>
          </div>
        </div>
      `;

          productList.appendChild(card);
        });

        totalPriceEl.textContent = "Rs." + total;
      }

      function updateQuantity(index, action) {
        if (action === "increase") {
          bucket[index].quantity += 1;
        } else if (action === "decrease") {
          bucket[index].quantity -= 1;
          if (bucket[index].quantity <= 0) {
            bucket.splice(index, 1);
          }
        }

        localStorage.setItem("bucket", JSON.stringify(bucket));
        renderCheckout();
      }

      renderCheckout();
    </script>
