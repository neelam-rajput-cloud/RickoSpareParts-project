<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body class="bg-gray-300">
    <a href="#">
      <div
        id="home"
        class="fixed z-50 bg-[#0090ff] h-16 w-16 rounded-full bottom-8 right-8 flex justify-center items-center border border-4 border-white"
      >
        <img src="svg/arrow-up.svg" class="w-8 h-8" alt="arrow up" />
      </div>
    </a>

    <header id="top" class="fixed top-0 left-0 w-full bg-white z-50">
      <div class="w-full bg-white py-3 border-b max-w-8xl mx-auto">
        <div class="flex justify-between px-6 items-center">
          <div class="flex items-center">
            <span class="text-2xl font-bold text-blue-600"
              >Hico Spare Parts</span
            >
          </div>

          <form class="w-[500px]">
            <label
              for="default-search"
              class="mb-2 text-sm font-medium text-gray-900 sr-only"
              >Search</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none"
              >
                <img
                  src="svg/search.svg"
                  class="w-4 h-4 text-gray-500"
                  alt="search"
                />
              </div>
              <input
                type="search"
                id="default-search"
                class="w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500"
                placeholder="Search..."
                required
              />
              <button
                type="submit"
                class="text-white absolute end-2.5 bottom-2 w-18 h-10 bg-[#0090ff] hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2"
              >
                Search
              </button>
            </div>
          </form>

          <div class="flex items-center space-x-8 text-gray-700 w-[250px]">
            <div class="text-center">
              <p class="font-bold">0000 -1234 56789</p>
              <p class="text-sm">info@example.com</p>
            </div>

            <div class="space-x-6">
              <button>
                <img
                  src="svg/search.svg"
                  class="w-4 h-4 text-gray-500"
                  alt="search"
                />
              </button>
              <button id="bucketBtn" class="relative">
                <img src="svg/cart.svg" class="w-6 h-6" alt="cart" />

                <span
                  id="bucketCount"
                  class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full"
                >
                  0
                </span>
              </button>

              <!-- Modal Overlay -->
              <div
                id="bucketModal"
                class="fixed inset-0 bg-black bg-opacity-40 hidden z-50"
              >
                <div
                  class="bg-white w-[90%] sm:w-[70%] md:w-[50%] lg:w-[40%] max-h-[80vh] rounded-2xl shadow-lg overflow-hidden flex flex-col"
                >
                  <div
                    class="flex justify-between items-center bg-[#0090ff] text-white px-5 py-3"
                  >
                    <h2 class="text-lg font-semibold">Your Bucket</h2>
                    <button
                      id="closeBucket"
                      class="text-xl hover:text-gray-200"
                    >
                      &times;
                    </button>
                  </div>

                  <div
                    id="bucket-items"
                    class="p-4 overflow-y-auto flex flex-col gap-3 max-h-[50vh]"
                  ></div>

                  <div
                    class="flex justify-between items-center px-5 py-3 border-t"
                  >
                    <span class="text-lg font-bold"
                      >Total: <span id="total-price">0</span> PKR</span
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <a href="index.html">
      <div
        id="top"
        class="fixed z-50 bg-[#0090ff] h-10 w-10 rounded-full top-24 left-4 flex justify-center items-center border-4 border-white"
      >
        <img src="svg/arrow-left.svg" class="w-8 h-8" alt="arrow left" />
      </div>
    </a>

    <aside
      class="w-64 top-[78px] h-screen bg-[#0090ff] text-white fixed left-0 overflow-y-auto shadow-lg"
    >
      <div class="p-6 border-b border-gray-700">
        <h2 class="text-xl pl-12 font-bold">Categories</h2>
      </div>
      <ul id="category-list" class="p-4 space-y-2">
        <li>
          <a
            href="#all-products"
            class="category-link block px-4 py-2 rounded-lg bg-white text-black font-semibold transition"
          >
            All Products
          </a>
        </li>
      </ul>
    </aside>

    <main class="ml-64 p-8 flex-1">
      <h1 id="all-products" class="text-5xl font-bold mb-6 mt-24 text-center">
        All Products
      </h1>

      <section id="products" class="p-8 space-y-12"></section>
    </main>

    <div
      id="productModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-[9999] flex justify-center items-center"
    >
      <div
        class="bg-white w-[400px] rounded-lg shadow-lg relative p-5 animate__animated animate__fadeIn"
      >
        <!-- Close Button -->
        <button
          id="closeModal"
          class="absolute top-3 right-3 text-xl font-bold"
        >
          &times;
        </button>

        <!-- Product Image -->
        <img id="modalImage" class="w-full h-52 object-cover rounded-lg mb-4" />

        <!-- Product Info -->
        <h2 id="modalName" class="text-2xl font-bold text-gray-800"></h2>
        <p id="modalBrand" class="text-gray-400 mt-1"></p>
        <p
          id="modalPrice"
          class="text-lg font-semibold text-green-600 mt-2"
        ></p>

        <p id="modalDescription" class="text-gray-600 mt-3 leading-6"></p>

        <!-- Quantity Controls -->
        <div class="flex items-center gap-4 mt-4">
          <button
            id="decreaseQty"
            class="bg-gray-300 w-8 h-8 rounded-full text-lg"
          >
            -
          </button>
          <span id="quantity" class="text-lg font-semibold">1</span>
          <button
            id="increaseQty"
            class="bg-gray-300 w-8 h-8 rounded-full text-lg"
          >
            +
          </button>
        </div>

        <!-- Add to Bucket Button -->
        <button
          id="addToBucket"
          class="w-full bg-[#0090ff] hover:bg-black text-white py-2 mt-4 rounded-lg font-semibold transition duration-300"
        >
          Add to Bucket
        </button>
      </div>
    </div>

    <script>
      const links = document.querySelectorAll(".category-link");

      links.forEach((link) => {
        link.addEventListener("click", function () {
          links.forEach((l) =>
            l.classList.remove("bg-white", "font-semibold", "text-black")
          );

          this.classList.add("bg-white", "font-semibold", "text-black");
        });
      });
    </script>

    <script src="products-data.js"></script>
    <script src="bucket.js"></script>
    <script src="products-card.js"></script>
  </body>
</html>
